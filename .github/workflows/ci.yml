name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate all tracked PHP files
        run: git ls-files -z '*.php' | xargs -0 -r -n1 php -l

  assets:
    name: JavaScript and ACF JSON validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: git ls-files -z '*.js' | xargs -0 -r -n1 node --check
      - name: Validate ACF field groups
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("acf-json").glob("*.json"))
          if not files:
              raise SystemExit("No ACF field group exports found")
          keys = set()
          for path in files:
              group = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(group, dict) or not group.get("key", "").startswith("group_"):
                  raise SystemExit(f"{path}: invalid ACF group key")
              if group["key"] in keys:
                  raise SystemExit(f"{path}: duplicate group key")
              if not isinstance(group.get("fields"), list):
                  raise SystemExit(f"{path}: missing field list")
              keys.add(group["key"])
              print(f"Validated {path}")
          PY
